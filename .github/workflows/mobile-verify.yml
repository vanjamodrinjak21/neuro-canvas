name: Mobile Verify

# Cheap unsigned native builds on every PR / push to main, so a broken
# Capacitor sync or Gradle config never reaches a release tag.
# All CI is GitHub-hosted — no self-hosted runners.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node postinstall downloads CUDA EP binaries on linux/x64 from
  # the NuGet CDN, which is flaky on runners. CI never uses the CUDA provider.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  android:
    name: Android (debug, unsigned) — advisory
    runs-on: ubuntu-latest
    # Advisory: surfaces native build regressions but does not block merges.
    # Underlying ecosystem issues tracked separately (Capacitor plugin alignment).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: npm ci --legacy-peer-deps

      - run: npx prisma generate
      - run: npm run generate
        env:
          NUXT_PUBLIC_COLLAB_ENABLED: 'false'
          NODE_OPTIONS: '--max-old-space-size=6144'

      - run: npx cap sync android

      - name: Assemble debug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug

  ios:
    name: iOS (build, no sign) — advisory
    # macos-15 is required: Capacitor 8.3+ ships its iOS core (capacitor-swift-pm)
    # as a prebuilt binary xcframework compiled with Swift 6.2 (Xcode 26). A Swift
    # module interface can only be consumed by a compiler >= the one that built it,
    # so the older macos-14 Xcodes (16.x / Swift 6.0) fail to import Capacitor and
    # report its members as missing (PluginConfig.getString, UIColor…color(fromHex:)).
    runs-on: macos-15
    # Advisory: surfaces native build regressions but does not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Select the newest Xcode on the runner; Capacitor's SPM binaries need a
      # Swift >= 6.2 toolchain (see runs-on note). Pin nothing — newest wins as
      # the runner image updates. Versions are printed for diagnosability.
      - name: Select newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          swift --version
          echo "XCODE_TAG=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_ENV"

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            ios/App/CapApp-SPM/.build
            ~/Library/Developer/Xcode/DerivedData
          # Scope to the Xcode version: compiled Swift modules in DerivedData are
          # toolchain-specific and must never be restored across Xcode upgrades,
          # or stale modules reintroduce the interface mismatch this job fixes.
          key: ${{ runner.os }}-spm-xc${{ env.XCODE_TAG }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'patches/**') }}
          restore-keys: ${{ runner.os }}-spm-xc${{ env.XCODE_TAG }}-

      - run: npm ci --legacy-peer-deps

      - run: npx prisma generate
      - run: npm run generate
        env:
          NUXT_PUBLIC_COLLAB_ENABLED: 'false'
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Sync Capacitor (SPM)
        run: npx cap sync ios

      - name: Build for simulator (no signing)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
