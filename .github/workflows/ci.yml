name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # onnxruntime-node postinstall downloads CUDA EP binaries on linux/x64 from
  # the NuGet CDN, which is flaky on runners. CI never uses the CUDA provider.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  i18n-check:
    # Cheap, fast, no install needed — runs in seconds. Catches the
    # duplicate-key class of bugs that JSON.parse silently merges and
    # missing translations across locales (default-locale = source of
    # truth). Both have shipped to prod undetected before.
    name: i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Locale duplicate-key + coverage check
        run: node scripts/i18n-check.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    # Blocking since AER-64: the repo typechecks clean — keep it that way.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare Nuxt
        run: npx nuxi prepare

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [i18n-check, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npx nuxi build
        env:
          NITRO_PRESET: node-server
          NODE_OPTIONS: '--max-old-space-size=6144'

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # NON-BLOCKING for now (AER-71). This job is brand-new: it spins up a full
    # Postgres + Redis + dev-server stack and drives a real browser, which is
    # inherently more flake-prone than the unit suites. Keep continue-on-error
    # until it has gone green across a handful of consecutive main-branch runs,
    # THEN delete this line to make it blocking (do NOT gate it behind `needs`
    # of the other jobs — it should surface auth regressions even when an
    # unrelated job is red).
    continue-on-error: true

    services:
      # pgvector image, not vanilla postgres: migration 20260424_vector_db runs
      # `CREATE EXTENSION vector`, which only exists in an image that ships it.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: neurocanvas
          POSTGRES_PASSWORD: neurocanvas
          POSTGRES_DB: neurocanvas_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neurocanvas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://neurocanvas:neurocanvas@localhost:5432/neurocanvas_e2e
      REDIS_URL: redis://localhost:6379
      # Deterministic secret for the ephemeral CI database only — never a real key.
      AUTH_SECRET: e2e-ci-secret-do-not-use-in-prod-000000000000
      AUTH_ORIGIN: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      # Keep NODE_ENV unset/development so cookies use the un-prefixed
      # `next-auth.session-token` name the specs expect (see e2e/fixtures.ts).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npx playwright test
        env:
          # The webServer child (`npm run dev`) inherits this. Nuxt's dev
          # server OOM'd Node's default heap on current runner images
          # (AER-106 CI runs) — give it the same headroom as the Build job.
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

# Tauri desktop builds live in tauri-beta.yml so a fast docs/code push
# does not cancel the long Cargo cold-build matrix mid-flight.
