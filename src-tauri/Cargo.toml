[package]
name = "neurocanvas"
version = "1.0.0"
description = "AI-powered mind mapping application"
authors = ["Vanja Modrinjak"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "neurocanvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ML / ONNX Runtime
# Base features (every platform). Platform-specific execution providers
# (CoreML / DirectML) are added additively in the `[target.…]` sections
# below — Cargo merges feature sets across all matching dependency tables.
ort = { version = "=2.0.0-rc.11", features = ["download-binaries"] }
tokenizers = "0.21"
ndarray = "0.16"

# HTTP download for full model
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"

# ── Platform-specific ONNX execution providers ───────────────────────────
# macOS (Apple Silicon + Intel): CoreML EP routes to Neural Engine / GPU.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.11", features = ["coreml"] }

# Windows (x86_64 / aarch64): DirectML EP routes to any DX12-capable GPU.
# The pyke prebuilt Windows ORT binaries already include DirectML support,
# so this just toggles on the EP-registration code path in the ort crate.
[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.11", features = ["directml"] }

[profile.release]
# NOTE: Do NOT use panic = "abort" — Tauri's IPC resolver has .expect() calls
# that can panic when a webview navigates during async command execution.
# Unwinding panics lets the app recover instead of crashing.
codegen-units = 1
lto = true
opt-level = 3
strip = false

[profile.dev]
incremental = true
